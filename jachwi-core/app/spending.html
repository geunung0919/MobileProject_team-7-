<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자취 생존 · 소비 관리</title>
<style>body{font:16px system-ui;background:#f4f7f6;color:#183d36;margin:0}main{max-width:720px;margin:32px auto;padding:20px}section{background:white;border-radius:20px;padding:24px;margin:16px 0}h1{font-size:30px}input,select,button{font:inherit;padding:12px;border:1px solid #ccd9d4;border-radius:10px;box-sizing:border-box;margin:5px 0;max-width:100%}button{background:#156c56;color:white;cursor:pointer}label{display:block;margin-top:8px}input{width:100%}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}small{color:#62766e}li{padding:12px 0;border-bottom:1px solid #eee}#status{white-space:pre-wrap;color:#994000}#balance{font-size:32px;font-weight:bold}button:disabled{opacity:.5}ul{padding-left:20px}</style>
<main><small>자취 생존 AI · 2번 모듈 개발 확인 화면</small><h1>내 소비 관리</h1><p>친구의 온보딩 서버와 같은 사용자·DB로 연결됩니다.</p>
<section><label>개발용 사용자 토큰<input id="token" type="password" autocomplete="off" placeholder="서버에 설정한 개발 토큰"></label><label>조회 월<input id="month" type="month"></label><button id="connect">연결 / 새로고침</button><p><small>토큰은 이 화면의 메모리에서만 사용합니다. 실제 로그인 화면은 아닙니다.</small></p></section>
<p id="status" role="status" aria-live="polite"></p><div id="content" hidden>
<section><small>남은 예산</small><div id="balance"></div><p id="summary"></p><p id="warning"></p><label>이번 달 예산 (원)<input id="budget" type="number" min="0" max="1000000000" step="1"></label><div class="row"><button id="saveBudget">예산 저장</button><button id="suggest">온보딩 예산 불러오기</button><button id="clearBudget">예산 해제</button></div><small>불러온 온보딩 예산은 ‘예산 저장’을 눌러야 적용됩니다.</small></section>
<section><h2 id="formTitle">지출 등록</h2><form id="expense"><label>사용처·내용<input id="title" required maxlength="100"></label><div class="row"><label>금액 (원)<input id="amount" type="number" min="1" max="1000000000" step="1" required></label><label>날짜<input id="date" type="date" required></label></div><label>분류<select id="category"><option value="food">외식·배달</option><option value="groceries">식재료</option><option value="living">생활용품</option><option value="transport">교통</option><option value="other">기타</option></select></label><button type="submit">저장</button> <button id="cancel" type="button">입력 초기화</button></form></section>
<section><h2>소비 내역</h2><ul id="list"></ul></section><section><h2>팀 대시보드 연결</h2><button id="dashboard">연결 결과 확인</button><pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></section></div></main>
<script>
const $=id=>document.getElementById(id),base='/api/v1/me';let editing=null,suggestion=null;
const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());$('month').value=today.slice(0,7);$('date').value=today;
const won=n=>n===null?'미설정':n.toLocaleString('ko-KR')+'원';
async function api(path,method='GET',body){const r=await fetch(base+path,{method,headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'요청 실패');return d;}
let busy=false;async function run(fn){if(busy)return;busy=true;const controls=[...document.querySelectorAll('button,input,select')];controls.forEach(e=>e.disabled=true);$('status').textContent='';try{await fn()}catch(e){$('status').textContent=e.message}finally{busy=false;controls.forEach(e=>e.disabled=false)}}
function reset() {editing=null;$('expense').reset();$('date').value=today;$('formTitle').textContent='지출 등록'}
async function refresh(){if(!$('month').value)throw Error('조회 월을 선택하세요.');const d=await api('/spending?period='+$('month').value);$('content').hidden=false;suggestion=d.suggested_budget_krw;$('budget').value=d.data.budget_krw??'';$('balance').textContent=won(d.data.remaining_krw);$('summary').textContent='예산 '+won(d.data.budget_krw)+' · 지출 '+won(d.data.spent_krw);$('warning').textContent={unset:'예산을 설정해 주세요.',exceeded:'예산을 초과했어요.',reached:'예산을 모두 사용했어요.',near_limit:'예산의 80% 이상 사용했어요.',normal:'예산 안에서 사용 중이에요.'}[d.warning];$('list').replaceChildren();if(!d.expenses.length)$('list').textContent='이 달의 소비 내역이 없습니다.';for(const e of d.expenses){const li=document.createElement('li'),text=document.createElement('div');text.textContent=e.spent_on+' · '+e.title+' · '+won(e.amount_krw);li.append(text);const edit=document.createElement('button');edit.textContent='수정';edit.onclick=()=>{editing=e.id;$('title').value=e.title;$('amount').value=e.amount_krw;$('date').value=e.spent_on;$('category').value=e.category;$('formTitle').textContent='지출 수정';$('title').focus()};const del=document.createElement('button');del.textContent='삭제';del.onclick=()=>run(async()=>{if(confirm('이 지출을 삭제할까요?')){await api('/spending/expenses/'+e.id,'DELETE');if(editing===e.id)reset();await refresh()}});li.append(edit,del);$('list').append(li)}}
$('connect').onclick=()=>run(async()=>{reset();$('result').textContent='';$('content').hidden=true;await refresh()});$('token').oninput=()=>{$('content').hidden=true;reset();$('result').textContent=''};$('month').onchange=()=>{$('content').hidden=true;reset()};
$('saveBudget').onclick=()=>run(async()=>{if($('budget').value==='')throw Error('예산을 입력하세요.');await api('/spending/budgets/'+$('month').value,'PUT',{budget_krw:Number($('budget').value)});await refresh()});$('clearBudget').onclick=()=>run(async()=>{await api('/spending/budgets/'+$('month').value,'PUT',{budget_krw:null});await refresh()});$('suggest').onclick=()=>run(async()=>{if(suggestion===null)throw Error('온보딩에 입력된 예산이 없습니다. 먼저 온보딩을 저장하세요.');$('budget').value=suggestion;$('status').textContent='온보딩 예산을 불러왔습니다. 예산 저장을 눌러 적용하세요.'});$('cancel').onclick=reset;
$('expense').onsubmit=e=>{e.preventDefault();run(async()=>{const body={title:$('title').value,amount_krw:Number($('amount').value),spent_on:$('date').value,category:$('category').value};await api('/spending/expenses'+(editing?'/'+editing:''),editing?'PUT':'POST',body);$('month').value=body.spent_on.slice(0,7);reset();await refresh()})};$('dashboard').onclick=()=>run(async()=>{$('result').textContent=JSON.stringify(await api('/dashboard'),null,2)});
</script></html>
